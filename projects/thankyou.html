<!DOCTYPE html>
<html lang="de">
<head>

  <style>
    /* Danke-Seite nach dem Absenden des Kontaktformulars */
    .ty {
      min-height: 100vh; min-height: 100svh;
      display: grid; align-content: center; justify-items: start; gap: clamp(18px, 3vh, 28px);
      padding: calc(var(--hdr-h, 76px) + 40px) var(--in) 80px;
    }
    .ty-title {
      margin: 0; max-width: 12em;
      font-family: var(--serif); font-weight: 400; font-variation-settings: "opsz" var(--opsz);
      font-size: clamp(40px, min(6.2vw, 10vh), 104px); line-height: .9; letter-spacing: -.01em;
      text-transform: uppercase; color: var(--ink);
    }
    .ty-text { margin: 0; max-width: 32em; font-size: 1rem; line-height: 1.6; color: var(--muted); }
    .ty-back {
      display: inline-flex; align-items: center; height: 46px; padding: 0 24px; margin-top: 8px;
      border-radius: 999px; background: #1b1b19; color: #fff;
      font-size: .9rem; font-weight: 500; letter-spacing: .3px; transition: background-color .25s;
    }
    .ty-back:hover { background: #731e3b; }
  </style>
</head>

<body>

  <header class="hdr">
    <div class="hdr-top is-plain">
      <a class="logo" href="../index.html" aria-label="why not? – Startseite">

      <div class="hdr-act">

        <div class="lang">

          <a href="#" id="btn-en" class="lang-link" aria-label="English">en</a>
        </div>
        <button class="burger" type="button" aria-controls="main-nav" aria-expanded="false" aria-label="Menü öffnen"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main class="ty">
    <h1 class="ty-title rv-lines" data-translate="thanks_title">Danke für deine Nachricht</h1>
    <p class="ty-text rv-fade" data-translate="thanks_text">Ich melde mich so schnell wie möglich bei dir – in der Regel innerhalb von 24 bis 48 Stunden.</p>
    <a class="ty-back rv-fade" href="../index.html" data-translate="thanks_back">Zurück zur Startseite</a>

  <script src="cursor.js?v=1" defer></script>
